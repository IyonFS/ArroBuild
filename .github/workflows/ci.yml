name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      GEMINI_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Validation tests
        run: npm run test:validation

      - name: Error formatting tests
        run: npm run test:errors

      - name: Security regression tests
        run: npm run test:security

      - name: Published content tests
        run: npm run test:content

      - name: Tier mapping tests
        run: npm run test:tiers

      - name: Credit ledger invariant tests
        run: npm run test:credits

      - name: Build
        run: npm run build

  # Jalankan lokal: npm run dev & npm run test:backend
  # Atau tambahkan secrets repo + job terpisah jika ingin E2E di CI
